<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Event Ticketing Hub</title>

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        header { background-color: #2c3e50; color: white; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .container { max-width: 1000px; margin: 0 auto; }
        .event-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .event-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid #3498db; }
        .event-title { margin: 0 0 10px 0; color: #2c3e50; }
        .event-meta { font-size: 0.9em; color: #7f8c8d; margin-bottom: 15px; }
        .tier-select { width: 100%; padding: 10px; margin-top: 10px; border-radius: 4px; border: 1px solid #bdc3c7; background-color: #fafafa; }
        .btn-book { display: block; width: 100%; background-color: #3498db; color: white; border: none; padding: 12px; margin-top: 15px; border-radius: 4px; font-weight: bold; cursor: pointer; text-align: center; transition: background 0.2s; }
        .btn-book:hover { background-color: #2980b9; }
        
        /* Modal checkout panel styling */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; max-width: 400px; width: 100%; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .timer-banner { background-color: #e74c3c; color: white; text-align: center; padding: 10px; font-weight: bold; border-radius: 4px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #bdc3c7; border-radius: 4px; box-sizing: border-box; }
        .btn-pay { width: 100%; background-color: #2ecc71; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 1.1em; }
        .btn-pay:hover { background-color: #27ae60; }
        .error-msg { color: #e74c3c; font-weight: bold; margin-top: 10px; display: none; text-align: center; }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🎟️ Event Ticketing Hub</h1>
            <p>Select your favorite event and secure your ticket reservations instantly</p>
        </header>

        <main id="events-display" class="event-grid">
            <p>Loading live database event listings...</p>
        </main>
    </div>

    <!-- Interactive Checkout Payment Overlay Modal -->
    <div id="checkout-modal" class="modal">
        <div class="modal-content">
            <div id="timer-display" class="timer-banner">Time Remaining: 05:00</div>
            <h3>💳 Complete Your Payment</h3>
            <p id="booking-details-text" style="font-size: 0.9em; color: #555;"></p>
            
            <div class="form-group">
                <label for="card-holder">Cardholder Name</label>
                <input type="text" id="card-holder" placeholder="Sylvester Stallone">
            </div>
            <div class="form-group">
                <label for="card-number">Card Number</label>
                <input type="text" id="card-number" placeholder="4242 4242 4242 4242">
                <small style="color: #7f8c8d;">Tip: Type '4242' to succeed, anything else will decline!</small>
            </div>
            
            <div id="payment-error" class="error-msg">❌ Card Declined! Please check details and try again.</div>
            <button class="btn-pay" id="submit-payment-btn">Confirm Secure Payment</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
